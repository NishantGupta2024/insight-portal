<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">Client Portal</div>
            <nav style="display: flex; align-items: center; gap: 16px;">
                <span id="user-name" style="color: rgb(var(--text-muted));"></span>
                <button onclick="logout()" class="btn btn-glass"
                    style="padding: 8px 16px; font-size: 0.9rem;">Logout</button>
            </nav>
        </header>

        <div class="dashboard-grid">
            <aside class="sidebar glass-panel" style="padding: 20px;">
                <ul>
                    <li><a href="#" class="active" onclick="switchTab('uploads')">My Uploads</a></li>
                    <li><a href="#" onclick="switchTab('reports')">Reports Received</a></li>
                </ul>
            </aside>

            <main class="content-area glass-panel">
                <!-- Uploads Section -->
                <div id="tab-uploads">
                    <h2>My Data Uploads</h2>
                    <div style="margin: 20px 0; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                        <h3>Upload New File</h3>
                        <form id="upload-form" style="max-width: 100%;">
                            <input type="text" id="file-desc" placeholder="Description (e.g. Q1 Sales Data)" required>
                            <input type="file" id="file-input" required>
                            <button type="submit" class="btn btn-primary"
                                style="width: auto; align-self: flex-start;">Upload File</button>
                        </form>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Filename</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="uploads-table-body">
                            <!-- Items here -->
                        </tbody>
                    </table>
                </div>

                <!-- Reports Section -->
                <div id="tab-reports" style="display: none;">
                    <h2>Business Reports</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Report Title</th>
                                <th>Date Received</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="reports-table-body">
                            <!-- Items here -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        checkAuthGuard('client');
        const user = getUser();
        document.getElementById('user-name').textContent = user.full_name;

        function switchTab(tab) {
            document.getElementById('tab-uploads').style.display = tab === 'uploads' ? 'block' : 'none';
            document.getElementById('tab-reports').style.display = tab === 'reports' ? 'block' : 'none';
            document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function loadUploads() {
            try {
                const uploads = await fetchAPI('/uploads');
                const tbody = document.getElementById('uploads-table-body');
                tbody.innerHTML = uploads.map(u => `
                    <tr>
                        <td>${u.filename}</td>
                        <td>${new Date(u.created_at).toLocaleDateString()}</td>
                        <td><span class="status-cell">Uploaded</span></td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function loadReports() {
            try {
                const reports = await fetchAPI('/reports');
                const tbody = document.getElementById('reports-table-body');
                tbody.innerHTML = reports.map(r => `
                    <tr>
                        <td>${r.title}</td>
                        <td>${new Date(r.created_at).toLocaleDateString()}</td>
                        <td><a href="${r.report_url}" target="_blank" class="btn btn-glass" style="padding: 4px 12px; font-size: 0.8rem;">Download</a></td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const desc = document.getElementById('file-desc').value;
            const fileInput = document.getElementById('file-input');

            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('description', desc);

            try {
                // Determine generic endpoint or specific
                await fetchAPI('/uploads/?description=' + encodeURIComponent(desc), {
                    method: 'POST',
                    body: formData
                });
                alert('File uploaded successfully');
                document.getElementById('upload-form').reset();
                loadUploads();
            } catch (err) {
                alert('Upload failed: ' + err.message);
            }
        });

        // Init
        loadUploads();
        loadReports();
    </script>
</body>

</html>
